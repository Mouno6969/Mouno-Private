org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true

# Preconfigure once, then build/install/run the app.
FORWARDER_SERVER_BASE_URL=https://YOUR_SERVER_DOMAIN
FORWARDER_SECRET=CHANGE_ME_SAME_AS_BOT_ENV
# Leave empty for main bot bKash number. Set seller sms_token for seller-specific forwarding.
FORWARDER_SELLER_TOKEN=
FORWARDER_SMS=true
FORWARDER_NOTIFICATIONS=true
